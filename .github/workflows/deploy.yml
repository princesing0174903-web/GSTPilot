# ═══════════════════════════════════════════════════════════════════════════════
# GSTPilot Infinity™ — Deployment Pipeline
#
# Auto-runs on push to `main` AFTER CI passes. Deploys Cloud Functions + rules.
# `deploy-app` and `rollback` are manual (workflow_dispatch) gates — production
# app deployment is gated to a human approver.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   • FIREBASE_TOKEN    — `firebase login:ci` token (used for all Firebase deploys)
#   • VERCEL_TOKEN      — only if deploying via Vercel (Option A below)
#   • VERCEL_ORG_ID     — Vercel org slug
#   • VERCEL_PROJECT_ID — Vercel project id
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy / rollback"
        required: false
        default: "manual"

# Only one deploy at a time per environment.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: gstpilot1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Pre-deploy gate: CI must have passed on this commit before we deploy it.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: Verify CI passed on this commit
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              check_name: 'CI',
            });
            const ciRuns = data.check_runs.filter(r => r.name === 'CI' || r.name.startsWith('CI / '));
            if (ciRuns.length === 0) {
              core.setFailed('No CI runs found for this commit. Run CI first.');
              return;
            }
            const failed = ciRuns.filter(r => r.conclusion === 'failure' || r.conclusion === 'cancelled' || r.conclusion === 'timed_out');
            if (failed.length > 0) {
              core.setFailed(`CI has ${failed.length} failed job(s). Resolve before deploying.`);
              return;
            }
            console.log(`CI passed on ${context.sha}. Proceeding with deploy.`);

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: ci-passed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache functions/node_modules
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: fn-node_modules-${{ runner.os }}-${{ hashFiles('functions/package-lock.json') }}

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy Cloud Functions
        working-directory: functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ env.FIREBASE_PROJECT }}
        run: |
          npm run build
          npx firebase deploy --only functions --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

  deploy-rules:
    name: Deploy Firestore + Storage rules + indexes
    runs-on: ubuntu-latest
    needs: ci-passed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy rules + indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ env.FIREBASE_PROJECT }}
        run: |
          firebase deploy --only firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

  # ─────────────────────────────────────────────────────────────────────────────
  # deploy-app: MANUAL trigger (workflow_dispatch). Two options documented below.
  # Pick ONE block to enable based on your hosting target.
  #
  # OPTION A — Firebase App Hosting (requires Firebase Blaze plan):
  #   - Set up backend once: `firebase apphosting:backends:create --project gstpilot1 --location asia-south1`
  #   - Set apphosting secrets via `firebase apphosting:secrets:set`.
  #   - Uncomment the firebase-apphosting block below to deploy.
  #
  # OPTION B — Vercel (easiest, no Blaze required):
  #   - Connect repo to Vercel via dashboard OR use the Vercel CLI block below.
  #   - Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub Secrets.
  #   - Uncomment the vercel block below to deploy.
  #
  # OPTION C — Cloud Run (self-managed GCP):
  #   - `gcloud run deploy gstpilot --source . --region asia-south1 --platform managed`
  #   - Requires a custom Dockerfile (not provided — see DEPLOYMENT.md).
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-app:
    name: Deploy Next.js app (manual gate)
    runs-on: ubuntu-latest
    needs: [deploy-functions, deploy-rules]
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          ERP_ENCRYPTION_KEY: ${{ secrets.ERP_ENCRYPTION_KEY }}
          BILLING_ENCRYPTION_KEY: ${{ secrets.BILLING_ENCRYPTION_KEY }}
          PAYMENT_PROVIDER: ${{ secrets.PAYMENT_PROVIDER }}
          BILLING_PROVIDER: ${{ secrets.BILLING_PROVIDER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run build

      # ── OPTION A: Firebase App Hosting ──────────────────────────────────────
      # Uncomment to enable.
      #
      # - name: Install firebase-tools
      #   run: npm install -g firebase-tools
      # - name: Deploy to Firebase App Hosting
      #   env:
      #     FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      #   run: |
      #     firebase apphosting:backends:deploy gstpilot-backend \
      #       --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

      # ── OPTION B: Vercel ─────────────────────────────────────────────────────
      # Uncomment to enable. Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets.
      #
      # - name: Install Vercel CLI
      #   run: npm install -g vercel
      # - name: Pull Vercel env
      #   run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      #   env:
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # - name: Build (Vercel)
      #   run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      #   env:
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # - name: Deploy to Vercel
      #   run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      #   env:
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: App deploy (placeholder)
        run: |
          echo "App deployment is a manual gate."
          echo "Pick OPTION A (Firebase App Hosting) or OPTION B (Vercel) in .github/workflows/deploy.yml"
          echo "and uncomment the corresponding block. See DEPLOYMENT.md for full instructions."

  # ─────────────────────────────────────────────────────────────────────────────
  # rollback: MANUAL trigger (workflow_dispatch). Re-deploys a previous commit
  # SHA to all three targets (functions, rules, app).
  #
  # Procedure (run this when production is broken):
  #   1. Identify the last-known-good commit SHA in the git history.
  #   2. Trigger this workflow from the GitHub Actions UI:
  #        - workflow_dispatch → enter `rollback_sha` input
  #   3. The workflow checks out that SHA, rebuilds + redeploys everything.
  #   4. Verify in the production UI + `/api/system/health`.
  #   5. If the rollback is permanent, also force-push the main branch to that
  #      SHA after communicating to the team: `git push -f origin <sha>:main`.
  #
  # Cloud Functions also supports `firebase functions:delete` + redeploy from a
  # specific git SHA — see https://firebase.google.com/docs/functions/manage-functions
  # ─────────────────────────────────────────────────────────────────────────────
  rollback:
    name: Rollback to previous commit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.reason == 'rollback'
    environment: production
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Rollback Cloud Functions
        working-directory: functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ env.FIREBASE_PROJECT }}
        run: |
          npm ci
          npm run build
          npx firebase deploy --only functions --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

      - name: Rollback rules + indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ env.FIREBASE_PROJECT }}
        run: |
          firebase deploy --only firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

      - name: Rollback summary
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  ROLLBACK COMPLETE"
          echo "  Target SHA: ${{ inputs.rollback_sha }}"
          echo "  Triggered by: ${{ github.actor }}"
          echo "  Reason: ${{ inputs.reason }}"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "Next steps:"
          echo "  1. Verify production at https://gstpilot1.web.app"
          echo "  2. Check /api/system/health returns 200"
          echo "  3. If the rollback is permanent, force-push main to the SHA:"
          echo "       git push -f origin ${{ inputs.rollback_sha }}:main"
          echo "  4. Schedule a postmortem (see docs/SECURITY.md → Incident Response)."
