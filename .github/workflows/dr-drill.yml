# ═══════════════════════════════════════════════════════════════════════════════
# GSTPilot Infinity™ — Weekly Disaster Recovery Drill
#
# Runs every Sunday at 04:00 IST (22:30 UTC Saturday) to validate the DR
# runbook WITHOUT touching production data. Also runnable on-demand via
# workflow_dispatch.
#
# What this workflow validates:
#   1. scripts/dr-restore-test.ts runs end-to-end and prints DR READINESS: PASS.
#   2. The Cloud Functions build is reproducible from main.
#   3. firestore.rules + storage.rules + firestore.indexes.json all parse.
#   4. The latest backup file exists and is parseable (if BACKUP_BUCKET configured).
#   5. The recovery runbook is up to date (file existence check).
#
# Failure policy: any failure pages on-call via issue creation.
# ═══════════════════════════════════════════════════════════════════════════════

name: DR Drill

on:
  schedule:
    # 22:30 UTC Saturday = 04:00 IST Sunday
    - cron: '30 22 * * 6'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual DR drill'
        required: false
        default: 'manual'

concurrency:
  group: dr-drill
  cancel-in-progress: false

jobs:
  dr-restore-test:
    name: DR Restore Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DR restore test
        run: bun run scripts/dr-restore-test.ts

      - name: Run production audit
        run: bun run scripts/production-audit.ts

      - name: Run deploy verification
        run: bun run scripts/deploy-verify.ts || echo "DEPLOY_VERIFY_EXIT=$?" >> $GITHUB_ENV

      - name: Upload DR drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-report-${{ github.run_id }}
          path: |
            dr-drill-output.txt
            audit-output.txt
          retention-days: 90
          if-no-files-found: ignore

  functions-build-verification:
    name: Cloud Functions reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache functions/node_modules
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: fn-dr-${{ runner.os }}-${{ hashFiles('functions/package-lock.json') }}

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Verify lib/index.js exists
        run: |
          if [ ! -f functions/lib/index.js ]; then
            echo "::error::functions/lib/index.js not produced by build"
            exit 1
          fi
          echo "✓ Functions build verified"

  rules-syntax-check:
    name: Firestore + Storage rules syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate firestore.indexes.json
        run: |
          if ! jq empty firestore.indexes.json 2>/dev/null; then
            echo "::error::firestore.indexes.json is not valid JSON"
            exit 1
          fi
          echo "✓ firestore.indexes.json is valid JSON"

      - name: Validate firestore.rules brace balance
        run: |
          OPEN=$(grep -o '{' firestore.rules | wc -l)
          CLOSE=$(grep -o '}' firestore.rules | wc -l)
          if [ "$OPEN" != "$CLOSE" ]; then
            echo "::error::firestore.rules brace imbalance: $OPEN open vs $CLOSE close"
            exit 1
          fi
          echo "✓ firestore.rules braces balanced ($OPEN pairs)"

      - name: Validate storage.rules brace balance
        run: |
          OPEN=$(grep -o '{' storage.rules | wc -l)
          CLOSE=$(grep -o '}' storage.rules | wc -l)
          if [ "$OPEN" != "$CLOSE" ]; then
            echo "::error::storage.rules brace imbalance: $OPEN open vs $CLOSE close"
            exit 1
          fi
          echo "✓ storage.rules braces balanced ($OPEN pairs)"

  on-failure-notify:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [dr-restore-test, functions-build-verification, rules-syntax-check]
    if: always() && (needs.dr-restore-test.result == 'failure' || needs.functions-build-verification.result == 'failure' || needs.rules-syntax-check.result == 'failure')
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const failed = [];
            for (const [k, v] of Object.entries(needs)) {
              if (v.result === 'failure') failed.push(k);
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 DR Drill FAILED — ${failed.join(', ')}`,
              body: [
                `**DR Drill run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                `**Failed jobs:** ${failed.join(', ')}`,
                `**Triggered by:** ${context.eventName}`,
                ``,
                `**Required follow-up:**`,
                `1. Investigate the failed job logs.`,
                `2. If a real disaster occurred, the recovery runbook would be blocked.`,
                `3. File a P1 incident and assign to on-call SRE.`,
                `4. Update docs/PHASE-12-PRODUCTION.md §12 (DR Validation) with findings.`,
              ].join('\n'),
              labels: ['dr', 'incident', 'p1'],
            });
